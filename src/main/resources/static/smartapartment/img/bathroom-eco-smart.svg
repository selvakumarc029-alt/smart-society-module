<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#e6f7ed"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>

    <linearGradient id="ceramicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="gloveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clean Bathroom Wall & Floor Background -->
  <rect width="400" height="400" fill="url(#bgTile)"/>
  <line x1="0" y1="280" x2="400" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="280" y1="0" x2="280" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Toilet Ceramic Base & Bowl -->
  <g transform="translate(180, 150)" filter="url(#softShadow)">
    <!-- Flush Tank (Back) -->
    <rect x="-80" y="-120" width="160" height="110" rx="12" fill="url(#ceramicGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="-86" y="-130" width="172" height="16" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="-122" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Bowl Outer Rim -->
    <path d="M-85 -10 C-85 110, 85 110, 85 -10 Z" fill="url(#ceramicGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Bowl Inner Rim / Basin -->
    <ellipse cx="0" cy="15" rx="68" ry="75" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="0" cy="25" rx="46" ry="50" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>

    <!-- Foamy Active Suds in Bowl -->
    <g fill="#ffffff" fill-opacity="0.85">
      <ellipse cx="-15" cy="28" rx="20" ry="14"/>
      <ellipse cx="12" cy="32" rx="18" ry="12"/>
      <ellipse cx="0" cy="18" rx="22" ry="10"/>
      <circle cx="-25" cy="15" r="8"/>
      <circle cx="22" cy="18" r="9"/>
      <circle cx="5" cy="42" r="7"/>
    </g>

    <!-- Cleaning Sponge / Scrubber in Bowl -->
    <rect x="-24" y="10" width="48" height="22" rx="6" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5"/>
    <rect x="-24" y="24" width="48" height="8" rx="2" fill="#059669"/>
  </g>

  <!-- Cleaning Technician Glove & Hand -->
  <g transform="translate(240, 90) rotate(-15)" filter="url(#softShadow)">
    <!-- Arm in Red Glove -->
    <path d="M20 -80 L75 -80 L60 80 L10 75 Z" fill="url(#gloveGrad)"/>
    <!-- Wrist Contour -->
    <ellipse cx="35" cy="78" rx="26" ry="10" fill="#dc2626"/>
    <!-- Hand / Fingers gripping handle -->
    <path d="M10 75 C10 110, 45 115, 55 95 C60 80, 50 75, 45 75 Z" fill="url(#gloveGrad)"/>
    <!-- Brush Handle -->
    <rect x="25" y="30" width="12" height="110" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Eco-Friendly Spray Bottle on Floor (Right Side) -->
  <g transform="translate(325, 220)" filter="url(#softShadow)">
    <!-- Bottle Body -->
    <path d="M15 45 L50 45 L58 130 L8 130 Z" fill="url(#bottleGrad)"/>
    <rect x="18" y="15" width="30" height="32" rx="4" fill="#10b981"/>
    <!-- Spray Trigger Mechanism -->
    <rect x="12" y="0" width="42" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <path d="M8 8 L-10 14 L-8 22 L10 18 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <path d="M18 18 C15 35, 10 40, 8 45" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Liquid Level / Eco Leaf Emblem on Bottle -->
    <circle cx="33" cy="85" r="16" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M33 75 C25 82, 28 95, 33 97 C38 95, 41 82, 33 75 Z" fill="#16a34a"/>
  </g>

  <!-- Amber Bottle on Left Floor -->
  <g transform="translate(45, 235)" filter="url(#softShadow)">
    <rect x="0" y="30" width="34" height="85" rx="6" fill="#b45309"/>
    <rect x="7" y="10" width="20" height="22" rx="2" fill="#d97706"/>
    <rect x="10" y="0" width="14" height="12" rx="2" fill="#1e293b"/>
    <rect x="4" y="50" width="26" height="38" rx="2" fill="#fef3c7"/>
    <line x1="8" y1="60" x2="26" y2="60" stroke="#78350f" stroke-width="1.5"/>
    <line x1="8" y1="68" x2="22" y2="68" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Sparkle & Shine Stars -->
  <g fill="#22c55e">
    <path d="M120 120 L122 126 L128 128 L122 130 L120 136 L118 130 L112 128 L118 126 Z"/>
    <path d="M260 210 L261 215 L266 216 L261 217 L260 222 L259 217 L254 216 L259 215 Z"/>
    <path d="M180 80 L181 84 L185 85 L181 86 L180 90 L179 86 L175 85 L179 84 Z"/>
  </g>
</svg>
