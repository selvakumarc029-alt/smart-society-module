<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cushionGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cushionSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
    <filter id="cushionShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Neutral Minimalist Background -->
  <rect width="400" height="400" fill="#f8fafc"/>

  <!-- Cushion Group -->
  <g transform="translate(200, 195) rotate(-2)">
    <!-- Main Cushion Body (Plump Square with Puffed Edges) -->
    <path d="M-105 -105 
             C -35 -125, 35 -125, 105 -105 
             C 125 -35, 125 35, 105 105 
             C 35 125, -35 125, -105 105 
             C -125 35, -125 -35, -105 -105 Z" 
          fill="url(#cushionGrad)" filter="url(#cushionShadow)"/>

    <!-- Subtle Fabric Texture / Highlight Center Plumpness -->
    <ellipse cx="0" cy="-10" rx="75" ry="60" fill="url(#cushionSheen)"/>

    <!-- Piping / Edge Seam Detail -->
    <path d="M-103 -103 
             C -35 -123, 35 -123, 103 -103 
             C 123 -35, 123 35, 103 103 
             C 35 123, -35 123, -103 103 
             C -123 35, -123 -35, -103 -103 Z" 
          fill="none" stroke="#9a3412" stroke-width="2" opacity="0.45"/>

    <!-- Fabric Crease Curves (Natural Soft Indentations) -->
    <path d="M-100 -100 Q -40 -30 -10 0" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M100 -100 Q 40 -30 10 0" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M-100 100 Q -40 30 -10 0" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M100 100 Q 40 30 10 0" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

    <!-- Central Button Tuft (Subtle) -->
    <circle cx="0" cy="0" r="4.5" fill="#7c2d12" opacity="0.5"/>
    <circle cx="1" cy="-1" r="2.5" fill="#fed7aa" opacity="0.5"/>
  </g>
</svg>
