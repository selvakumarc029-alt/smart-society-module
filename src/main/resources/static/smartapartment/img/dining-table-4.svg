<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roomBg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="75%" stop-color="#f5efe6"/>
      <stop offset="75%" stop-color="#e2d9cd"/>
      <stop offset="100%" stop-color="#d4c8b8"/>
    </linearGradient>
    <linearGradient id="tableTop4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a4231"/>
      <stop offset="50%" stop-color="#73543f"/>
      <stop offset="100%" stop-color="#3d2c20"/>
    </linearGradient>
    <linearGradient id="mustardChair4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="tableShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Wall and Floor Background -->
  <rect width="400" height="400" fill="url(#roomBg4)"/>

  <!-- Back Chairs (2 visible behind table) -->
  <g transform="translate(130, 165)">
    <rect x="0" y="0" width="48" height="42" rx="6" fill="#a16207"/>
    <line x1="6" y1="42" x2="4" y2="92" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="42" y1="42" x2="44" y2="92" stroke="#1e293b" stroke-width="2.5"/>
  </g>
  <g transform="translate(222, 165)">
    <rect x="0" y="0" width="48" height="42" rx="6" fill="#a16207"/>
    <line x1="6" y1="42" x2="4" y2="92" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="42" y1="42" x2="44" y2="92" stroke="#1e293b" stroke-width="2.5"/>
  </g>

  <!-- Table Metal Legs / Blue Cross Base -->
  <g stroke="#1e3a8a" stroke-width="7" stroke-linecap="round">
    <line x1="200" y1="230" x2="165" y2="340"/>
    <line x1="200" y1="230" x2="235" y2="340"/>
    <line x1="165" y1="340" x2="235" y2="340" stroke-width="5"/>
  </g>

  <!-- Round Table Top (Perspective Ellipse) -->
  <ellipse cx="200" cy="225" rx="115" ry="30" fill="url(#tableTop4)" filter="url(#tableShadow4)"/>
  <ellipse cx="200" cy="223" rx="113" ry="28" fill="#654a37"/>
  <ellipse cx="200" cy="222" rx="111" ry="26" fill="none" stroke="#8c6a51" stroke-width="1.5" opacity="0.6"/>

  <!-- Vase on Table -->
  <g transform="translate(192, 168)">
    <path d="M6 36 L 4 48 Q 8 52 16 48 L 14 36 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <path d="M10 36 Q 5 20 0 12" stroke="#475569" stroke-width="1.2" fill="none"/>
    <ellipse cx="1" cy="13" rx="3.5" ry="2" fill="#64748b" transform="rotate(-30 1 13)"/>
    <path d="M10 36 Q 16 18 24 10" stroke="#475569" stroke-width="1.2" fill="none"/>
    <ellipse cx="23" cy="11" rx="3.5" ry="2" fill="#64748b" transform="rotate(30 23 11)"/>
  </g>

  <!-- Front 2 Chairs (Mustard Yellow with Black Metal Legs) -->
  <g transform="translate(80, 210)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="url(#mustardChair4)"/>
    <rect x="-2" y="44" width="60" height="16" rx="6" fill="#eab308"/>
    <line x1="4" y1="60" x2="-6" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="52" y1="60" x2="62" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(264, 210)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="url(#mustardChair4)"/>
    <rect x="-2" y="44" width="60" height="16" rx="6" fill="#eab308"/>
    <line x1="4" y1="60" x2="-6" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="52" y1="60" x2="62" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
