<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="75%" stop-color="#f5efe6"/>
      <stop offset="75%" stop-color="#e2d9cd"/>
      <stop offset="100%" stop-color="#d4c8b8"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a4231"/>
      <stop offset="50%" stop-color="#73543f"/>
      <stop offset="100%" stop-color="#3d2c20"/>
    </linearGradient>
    <linearGradient id="mustardChair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="blueBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="tableShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Wall and Floor Background -->
  <rect width="400" height="400" fill="url(#roomBg)"/>

  <!-- Back Chairs (3 visible tops behind table) -->
  <!-- Back Left Chair -->
  <g transform="translate(110, 170)">
    <rect x="0" y="0" width="46" height="40" rx="6" fill="#a16207"/>
    <line x1="6" y1="40" x2="4" y2="90" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="40" y1="40" x2="42" y2="90" stroke="#1e293b" stroke-width="2.5"/>
  </g>
  <!-- Back Center Chair -->
  <g transform="translate(178, 155)">
    <rect x="0" y="0" width="48" height="42" rx="6" fill="#ca8a04"/>
    <line x1="6" y1="42" x2="4" y2="95" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="42" y1="42" x2="44" y2="95" stroke="#1e293b" stroke-width="2.5"/>
  </g>
  <!-- Back Right Chair -->
  <g transform="translate(244, 170)">
    <rect x="0" y="0" width="46" height="40" rx="6" fill="#a16207"/>
    <line x1="6" y1="40" x2="4" y2="90" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="40" y1="40" x2="42" y2="90" stroke="#1e293b" stroke-width="2.5"/>
  </g>

  <!-- Table Metal Legs / Architectural Blue Base -->
  <g stroke="url(#blueBase)" stroke-width="7" stroke-linecap="round">
    <line x1="200" y1="230" x2="160" y2="340"/>
    <line x1="200" y1="230" x2="240" y2="340"/>
    <line x1="160" y1="340" x2="240" y2="340" stroke-width="5"/>
    <line x1="200" y1="230" x2="200" y2="335" stroke-width="6"/>
  </g>

  <!-- Round Table Top (Perspective Ellipse) -->
  <ellipse cx="200" cy="225" rx="120" ry="32" fill="url(#tableTop)" filter="url(#tableShadow)"/>
  <ellipse cx="200" cy="223" rx="118" ry="30" fill="#654a37"/>
  <!-- Tabletop Highlight / Rim -->
  <ellipse cx="200" cy="222" rx="116" ry="28" fill="none" stroke="#8c6a51" stroke-width="1.5" opacity="0.6"/>

  <!-- Vase & Foliage on Table -->
  <g transform="translate(192, 165)">
    <!-- White Minimalist Ceramic Vase -->
    <path d="M6 36 L 4 48 Q 8 52 16 48 L 14 36 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Delicate Green Eucalyptus Sprigs -->
    <path d="M10 36 Q 5 20 0 12" stroke="#475569" stroke-width="1.2" fill="none"/>
    <ellipse cx="1" cy="13" rx="3.5" ry="2" fill="#64748b" transform="rotate(-30 1 13)"/>
    <ellipse cx="4" cy="20" rx="3.5" ry="2" fill="#64748b" transform="rotate(-30 4 20)"/>
    <path d="M10 36 Q 16 18 24 10" stroke="#475569" stroke-width="1.2" fill="none"/>
    <ellipse cx="23" cy="11" rx="3.5" ry="2" fill="#64748b" transform="rotate(30 23 11)"/>
    <ellipse cx="17" cy="19" rx="3.5" ry="2" fill="#64748b" transform="rotate(30 17 19)"/>
  </g>

  <!-- Front 3 Chairs (Mustard Yellow with Black Metal Legs) -->
  <!-- Front Left Chair -->
  <g transform="translate(68, 205)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="url(#mustardChair)"/>
    <!-- Seat Cushion -->
    <rect x="-2" y="44" width="60" height="16" rx="6" fill="#eab308"/>
    <!-- Legs -->
    <line x1="4" y1="60" x2="-6" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="52" y1="60" x2="62" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Front Center Right Chair -->
  <g transform="translate(276, 205)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="url(#mustardChair)"/>
    <!-- Seat Cushion -->
    <rect x="-2" y="44" width="60" height="16" rx="6" fill="#eab308"/>
    <!-- Legs -->
    <line x1="4" y1="60" x2="-6" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="52" y1="60" x2="62" y2="155" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
