<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="marbleWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="countertop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="blindColor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#785539"/>
      <stop offset="60%" stop-color="#9a6e4d"/>
      <stop offset="100%" stop-color="#5e4128"/>
    </linearGradient>
    <linearGradient id="chromeTap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Marble Wall Background -->
  <rect width="400" height="400" fill="url(#marbleWall)"/>
  <!-- Marble Veins -->
  <path d="M40 0 Q 120 180 80 400" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M300 0 Q 360 220 320 400" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Window Frame -->
  <rect x="70" y="30" width="260" height="280" rx="4" fill="#334155"/>
  <rect x="76" y="36" width="248" height="268" rx="2" fill="url(#skyGrad)"/>
  <!-- Window Divider -->
  <line x1="200" y1="36" x2="200" y2="304" stroke="#475569" stroke-width="4"/>

  <!-- Venetian Horizontal Blinds (Wood Slats) -->
  <g fill="url(#blindColor)">
    <rect x="72" y="34" width="256" height="14" rx="2" fill="#5e4128"/>
    <!-- Horizontal Slats -->
    <rect x="76" y="52" width="248" height="7" rx="1.5"/>
    <rect x="76" y="63" width="248" height="7" rx="1.5"/>
    <rect x="76" y="74" width="248" height="7" rx="1.5"/>
    <rect x="76" y="85" width="248" height="7" rx="1.5"/>
    <rect x="76" y="96" width="248" height="7" rx="1.5"/>
    <rect x="76" y="107" width="248" height="7" rx="1.5"/>
    <rect x="76" y="118" width="248" height="7" rx="1.5"/>
    <rect x="76" y="129" width="248" height="7" rx="1.5"/>
    <rect x="76" y="140" width="248" height="7" rx="1.5"/>
  </g>
  <!-- Blinds Cords -->
  <line x1="120" y1="36" x2="120" y2="155" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="280" y1="36" x2="280" y2="155" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Kitchen Countertop Slab -->
  <rect x="0" y="320" width="400" height="80" fill="url(#countertop)"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#94a3b8" stroke-width="2"/>

  <!-- Gooseneck Chrome Faucet -->
  <g transform="translate(100, 230)">
    <!-- Base -->
    <rect x="16" y="80" width="16" height="12" rx="2" fill="url(#chromeTap)"/>
    <!-- Neck -->
    <path d="M24 80 L 24 35 A 18 18 0 0 1 54 35 L 54 50" fill="none" stroke="url(#chromeTap)" stroke-width="6" stroke-linecap="round"/>
    <!-- Spout -->
    <rect x="51" y="50" width="6" height="6" rx="1" fill="#475569"/>
  </g>

  <!-- Potted Herb Plants on Sill -->
  <g transform="translate(160, 280)">
    <!-- Pot 1 -->
    <polygon points="10,40 14,24 28,24 32,40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Leaves -->
    <circle cx="21" cy="20" r="7" fill="#16a34a"/>
    <circle cx="16" cy="14" r="5" fill="#22c55e"/>
    <circle cx="26" cy="15" r="5" fill="#4ade80"/>

    <!-- Pot 2 -->
    <polygon points="42,40 46,24 60,24 64,40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Leaves -->
    <circle cx="53" cy="20" r="7" fill="#15803d"/>
    <circle cx="48" cy="14" r="5" fill="#16a34a"/>
    <circle cx="58" cy="15" r="5" fill="#22c55e"/>
  </g>
</svg>
