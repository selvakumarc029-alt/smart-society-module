<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sinkSurface" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="drainOuter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="95%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="drainHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="drainShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sink Basin Background -->
  <rect width="400" height="400" fill="url(#sinkSurface)"/>

  <!-- Subtle Sink Basin Contours & Brushed Finish Lines -->
  <path d="M-50 150 Q 200 80 450 150" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M-50 220 Q 200 160 450 250" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M20 380 Q 200 320 380 380" stroke="#475569" stroke-width="3" fill="none" opacity="0.25"/>

  <!-- Drain Outer Bezel -->
  <circle cx="230" cy="220" r="130" fill="url(#metalRim)" filter="url(#drainShad)"/>
  <circle cx="230" cy="220" r="118" fill="url(#drainOuter)"/>

  <!-- Inner Recessed Step -->
  <circle cx="230" cy="220" r="95" fill="#475569"/>
  <circle cx="230" cy="220" r="90" fill="url(#metalRim)"/>
  <circle cx="230" cy="220" r="75" fill="url(#drainHole)"/>

  <!-- Radial Drain Strainer Slots (18 Slots) -->
  <g transform="translate(230, 220)">
    <!-- Central Stopper Knob -->
    <circle cx="0" cy="0" r="42" fill="url(#metalRim)"/>
    <circle cx="0" cy="0" r="32" fill="url(#drainOuter)"/>
    <circle cx="0" cy="0" r="18" fill="#334155"/>
    <circle cx="0" cy="0" r="14" fill="url(#metalRim)"/>

    <!-- Slotted Holes Ring -->
    <g fill="#0f172a">
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(0)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(20)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(40)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(60)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(80)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(100)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(120)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(140)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(160)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(180)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(200)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(220)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(240)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(260)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(280)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(300)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(320)"/>
      <rect x="-3" y="-70" width="6" height="24" rx="3" transform="rotate(340)"/>
    </g>
  </g>

  <!-- Sparkle / Gleam Highlights -->
  <path d="M145 140 L 155 140 M 150 135 L 150 145" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M305 160 L 315 160 M 310 155 L 310 165" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
