<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c88351"/>
      <stop offset="50%" stop-color="#ab6937"/>
      <stop offset="100%" stop-color="#8a4f23"/>
    </linearGradient>
    <linearGradient id="innerWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a5726"/>
      <stop offset="100%" stop-color="#733b14"/>
    </linearGradient>
    <linearGradient id="silver1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="silver2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pastelSpoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="trayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Kitchen Counter -->
  <rect width="400" height="400" fill="#f1ece6"/>
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#e6ded5" stroke-width="2"/>

  <!-- Wooden Cutlery Tray (Angled) -->
  <g transform="rotate(-18 200 200)">
    <!-- Outer Tray Box -->
    <rect x="80" y="40" width="240" height="320" rx="14" fill="url(#woodGrad)" filter="url(#trayShadow)"/>
    <!-- Inner Compartment 1 (Main) -->
    <rect x="94" y="54" width="104" height="292" rx="8" fill="url(#innerWood)"/>
    <!-- Inner Compartment 2 (Side Top) -->
    <rect x="210" y="54" width="96" height="138" rx="8" fill="url(#innerWood)"/>
    <!-- Inner Compartment 3 (Side Bottom) -->
    <rect x="210" y="206" width="96" height="140" rx="8" fill="url(#innerWood)"/>

    <!-- Cutlery Shadow Layer -->
    <g opacity="0.3" transform="translate(6, 10)">
      <ellipse cx="146" cy="120" rx="28" ry="42" fill="#000"/>
      <rect x="140" y="150" width="12" height="150" rx="6" fill="#000"/>
    </g>

    <!-- First Stainless Steel Spoon -->
    <g transform="translate(130, 80)">
      <!-- Spoon Bowl -->
      <ellipse cx="15" cy="40" rx="26" ry="38" fill="url(#silver1)"/>
      <ellipse cx="15" cy="40" rx="21" ry="32" fill="url(#silver2)" opacity="0.85"/>
      <path d="M5 28 Q 15 48 15 65" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
      <!-- Spoon Handle -->
      <path d="M12 72 Q 10 160 8 200 Q 15 208 22 200 Q 20 160 18 72 Z" fill="url(#silver1)"/>
      <path d="M15 80 L 15 190" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Second Stainless Steel Spoon (Stacked) -->
    <g transform="translate(148, 105)">
      <!-- Spoon Bowl -->
      <ellipse cx="15" cy="40" rx="25" ry="36" fill="url(#silver2)"/>
      <ellipse cx="15" cy="40" rx="20" ry="30" fill="url(#silver1)" opacity="0.9"/>
      <path d="M7 28 Q 15 46 15 62" stroke="#ffffff" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round"/>
      <!-- Spoon Handle -->
      <path d="M12 70 Q 10 145 9 175 Q 15 182 21 175 Q 20 145 18 70 Z" fill="url(#silver2)"/>
    </g>

    <!-- Pastel Mint Baby / Dessert Spoon (Held or Resting) -->
    <g transform="translate(162, 140) rotate(12)">
      <ellipse cx="12" cy="30" rx="18" ry="26" fill="url(#pastelSpoon)"/>
      <path d="M10 52 Q 8 130 7 155 Q 12 160 17 155 Q 16 130 14 52 Z" fill="url(#pastelSpoon)"/>
      <path d="M12 20 Q 12 40 12 145" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hand / Glove silhouette (Soft accent) -->
  <g transform="translate(40, 260) rotate(-25)" opacity="0.9">
    <ellipse cx="50" cy="50" rx="40" ry="24" fill="#fed7aa"/>
    <rect x="40" y="30" width="70" height="20" rx="10" fill="#fed7aa"/>
  </g>
</svg>
