<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="blueGlove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="squeegeeMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Outdoor / Sky View Through Window -->
  <rect width="400" height="400" fill="#e2e8f0"/>
  <rect width="400" height="400" fill="url(#glassBg)"/>

  <!-- White Window Frame / Mullions -->
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#ffffff" stroke-width="28"/>
  <line x1="0" y1="0" x2="400" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- Thick Soapy Foam / Lather on Glass (Right and Bottom) -->
  <g fill="url(#foamGrad)" opacity="0.88">
    <ellipse cx="320" cy="180" rx="90" ry="140"/>
    <ellipse cx="280" cy="300" rx="120" ry="90"/>
    <ellipse cx="220" cy="340" rx="90" ry="70"/>
    <circle cx="350" cy="80" r="45"/>
    <circle cx="310" cy="120" r="35"/>
    <circle cx="360" cy="270" r="55"/>
    <!-- Foam Splash Drops -->
    <circle cx="210" cy="160" r="6" fill="#ffffff"/>
    <circle cx="230" cy="140" r="4" fill="#ffffff"/>
    <circle cx="190" cy="220" r="8" fill="#ffffff"/>
    <circle cx="170" cy="260" r="5" fill="#ffffff"/>
    <circle cx="260" cy="90" r="7" fill="#ffffff"/>
  </g>

  <!-- Cleaned Streak-Free Path with Gleam -->
  <path d="M40 40 L 220 180 L 160 380 L 40 380 Z" fill="#38bdf8" fill-opacity="0.15"/>
  <line x1="120" y1="60" x2="190" y2="160" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <line x1="80" y1="120" x2="130" y2="200" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Squeegee Tool & Arm -->
  <g transform="translate(140, 60) rotate(35)">
    <!-- Squeegee Rubber Blade -->
    <rect x="-70" y="0" width="140" height="8" rx="2" fill="#0f172a"/>
    <!-- Stainless Steel Channel -->
    <rect x="-65" y="-10" width="130" height="10" rx="2" fill="url(#squeegeeMetal)"/>
    <!-- Handle Bracket -->
    <path d="M-12 -10 L -6 -35 L 6 -35 L 12 -10 Z" fill="url(#squeegeeMetal)"/>
    <!-- Handle Grip (Black/Blue) -->
    <rect x="-10" y="-75" width="20" height="40" rx="5" fill="#1e293b"/>

    <!-- Hand with Blue Rubber Cleaning Glove -->
    <g transform="translate(0, -70)">
      <!-- Palm / Fist -->
      <ellipse cx="0" cy="0" rx="22" ry="18" fill="url(#blueGlove)"/>
      <!-- Thumb -->
      <path d="M-16 -8 C -24 -15 -20 -30 -10 -24 Z" fill="url(#blueGlove)"/>
      <!-- Fingers wrapped around handle -->
      <rect x="-8" y="-16" width="22" height="8" rx="4" fill="#2563eb"/>
      <rect x="-8" y="-8" width="22" height="8" rx="4" fill="#1d4ed8"/>
      <rect x="-8" y="0" width="22" height="8" rx="4" fill="#1e40af"/>
      <!-- Forearm in Blue Glove extending out -->
      <path d="M-18 6 L -35 80 L 15 80 L 18 6 Z" fill="url(#blueGlove)"/>
    </g>
  </g>

  <!-- Sparkle on Clean Glass -->
  <path d="M90 100 L 100 100 M 95 95 L 95 105" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 240 L 150 240 M 145 235 L 145 245" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
