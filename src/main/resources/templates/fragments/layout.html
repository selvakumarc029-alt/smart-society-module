<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Smart Society'">Smart Society</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Animate.css for Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared project typography: one readable font system across every dashboard. -->
    <link rel="stylesheet" th:href="@{/shared/css/typography.css(v='20260818-readable-type-v1')}">
    
    <!-- Custom Bootstrap Theme Overrides -->
    <link rel="stylesheet" th:href="@{/smartapartment/css/theme-bootstrap.css(v='20260912-global-alignment-v3')}">
    <link rel="stylesheet" th:href="@{/smartapartment/css/ai-helpdesk.css(v='20260826-compact-btn-v3')}">
    <link rel="stylesheet" href="/shared/css/dashboard-flat.css?v=20260831-blue-headings-v1">
    <link rel="stylesheet" href="/shared/css/required-fields.css?v=20260826-no-login-star-v5">
    <link rel="stylesheet" href="/shared/css/dashboard-system.css?v=20260916-universal-sidebar-v4">

    <style id="global-dashboard-alignment-lock">
        /* ==========================================================================
           GLOBAL DASHBOARD ALIGNMENT SYSTEM (SmartSociety & PropertyDirect)
           Docked unified flush sidebar, full-height main canvas, wide rectangular stat tiles
           ========================================================================== */
        html, body.dashboard-body, body.app-dashboard {
            --dashboard-sidebar-width: 300px;
            --dashboard-topbar-height: 82px;
            height: 100% !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            background: #f8fafc !important;
        }

        /* 1. Flush Full-Height Docked Sidebar */
        body.dashboard-body .sidebar,
        body.dashboard-body #sidebar,
        body.app-dashboard .dash-sidebar,
        body.app-dashboard .vendor-sidebar,
        body.app-dashboard .agent-sidebar,
        .sidebar,
        #sidebar {
            position: fixed !important;
            top: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            inset: 0 auto 0 0 !important;
            width: var(--dashboard-sidebar-width) !important;
            min-width: var(--dashboard-sidebar-width) !important;
            max-width: var(--dashboard-sidebar-width) !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            border-right: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 0 !important;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15) !important;
            display: flex !important;
            flex-direction: column !important;
            z-index: 1040 !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            transform: none !important;
            background: #0f172a !important;
            color: #f8fafc !important;
        }

        /* Hide close/reopen buttons on desktop */
        @media (min-width: 901px) {
            .dashboard-sidebar-close,
            .dashboard-sidebar-open,
            .pd-sidebar-cancel,
            .pd-sidebar-reopen,
            body.dashboard-body .sidebar > .dashboard-sidebar-close,
            body.dashboard-body #sidebar > .dashboard-sidebar-close,
            body.app-dashboard .dash-sidebar > .dashboard-sidebar-close,
            * > .dashboard-sidebar-close {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
        }

        /* Sidebar Header & Brand Text: Never truncate */
        .sidebar .sidebar-header,
        #sidebar .sidebar-header,
        .dash-sidebar .dash-brand {
            height: var(--dashboard-topbar-height) !important;
            min-height: var(--dashboard-topbar-height) !important;
            max-height: var(--dashboard-topbar-height) !important;
            padding: 0 1.5rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.75rem !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            background: transparent !important;
            box-sizing: border-box !important;
            overflow: visible !important;
        }

        .sidebar .sidebar-header h4,
        #sidebar .sidebar-header h4,
        .dash-sidebar .dash-brand h4,
        .sidebar .sidebar-header h4 span,
        #sidebar .sidebar-header h4 span {
            margin: 0 !important;
            font-size: 1.18rem !important;
            font-weight: 800 !important;
            white-space: nowrap !important;
            overflow: visible !important;
            text-overflow: clip !important;
            letter-spacing: -0.02em !important;
            line-height: 1.1 !important;
        }

        /* 2. Docked Main Content Canvas */
        body.dashboard-body .main-content,
        body.dashboard-body .main,
        body.app-dashboard .dash-main,
        body.app-dashboard .vendor-main,
        body.app-dashboard .agent-main,
        .main-content {
            margin: 0 0 0 var(--dashboard-sidebar-width) !important;
            width: calc(100% - var(--dashboard-sidebar-width)) !important;
            max-width: calc(100% - var(--dashboard-sidebar-width)) !important;
            min-height: 100vh !important;
            min-height: 100dvh !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            overflow-x: hidden !important;
            background: #f8fafc !important;
        }

        /* 3. Sticky Topbar Header */
        body.dashboard-body .topbar,
        body.dashboard-body .header,
        body.app-dashboard .dash-header,
        body.app-dashboard .vendor-top,
        .topbar {
            position: sticky !important;
            top: 0 !important;
            z-index: 1020 !important;
            height: var(--dashboard-topbar-height) !important;
            min-height: var(--dashboard-topbar-height) !important;
            max-height: var(--dashboard-topbar-height) !important;
            margin: 0 !important;
            padding: 0 32px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            border: 0 !important;
            border-bottom: 1px solid #e2e8f0 !important;
            border-radius: 0 !important;
            background: #ffffff !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04) !important;
            box-sizing: border-box !important;
            flex-shrink: 0 !important;
        }

        /* 4. Dashboard Inner Container */
        body.dashboard-body .dashboard-container,
        body.app-dashboard .dash-panel,
        .dashboard-container {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 24px 32px 48px !important;
            box-sizing: border-box !important;
            flex: 1 1 auto !important;
        }

        /* 5. Four-Column Stat / KPI Card Grid & Bootstrap Column Reset */
        body.dashboard-body .stats,
        body.app-dashboard .dash-grid,
        .stats {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            gap: 16px !important;
            margin-bottom: 24px !important;
            width: 100% !important;
        }
        body.dashboard-body .stats.three,
        body.app-dashboard .dash-grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        }
        body.dashboard-body .stats.five,
        body.app-dashboard .dash-grid.five,
        body.app-dashboard .dash-panel[data-view="overview"] .dash-grid {
            grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
        }
        @media (max-width: 1200px) {
            body.dashboard-body .stats,
            body.app-dashboard .dash-grid,
            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }
        }
        @media (max-width: 576px) {
            body.dashboard-body .stats,
            body.app-dashboard .dash-grid,
            .stats {
                grid-template-columns: 1fr !important;
            }
        }

        /* CRITICAL RESET: Override Bootstrap .col-md-3 width: 25% inside CSS Grid */
        body.dashboard-body .stats > [class*="col-"],
        body.dashboard-body .stats > div,
        body.app-dashboard .dash-grid > [class*="col-"],
        body.app-dashboard .dash-grid > div,
        .stats > [class*="col-"],
        .stats > div {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            flex: 1 1 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }

        /* Stat Card Tile: Wide rectangular tile with label at top and count below */
        body.dashboard-body .stats :is(article, .card),
        body.app-dashboard .dash-grid :is(article, .card, .dash-card),
        .stats :is(article, .card) {
            position: relative !important;
            width: 100% !important;
            min-width: 0 !important;
            min-height: 104px !important;
            height: 100% !important;
            padding: 18px 22px !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: flex-start !important;
            text-align: left !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 14px !important;
            color: #0f172a !important;
            background: #ffffff !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.02) !important;
            box-sizing: border-box !important;
            overflow: hidden !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
        }

        body.dashboard-body .stats :is(article, .card):hover,
        body.app-dashboard .dash-grid :is(article, .card, .dash-card):hover,
        .stats :is(article, .card):hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08) !important;
            border-color: #cbd5e1 !important;
        }

        body.dashboard-body .stats :is(article, .card)::before,
        body.dashboard-body .stats :is(article, .card)::after,
        body.app-dashboard .dash-grid :is(article, .card, .dash-card)::before,
        body.app-dashboard .dash-grid :is(article, .card, .dash-card)::after,
        .stats :is(article, .card)::before,
        .stats :is(article, .card)::after {
            display: none !important;
            content: none !important;
        }

        body.dashboard-body .stats :is(article, .card) :is(span, small, .stat-label),
        body.app-dashboard .dash-grid :is(article, .card, .dash-card) :is(span, small, .stat-label),
        .stats :is(article, .card) :is(span, small, .stat-label) {
            order: 1 !important;
            color: #64748b !important;
            font-size: 0.74rem !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.06em !important;
            line-height: 1.25 !important;
            margin-bottom: 6px !important;
            margin-top: 0 !important;
            display: block !important;
            white-space: normal !important;
            word-break: normal !important;
        }

        body.dashboard-body .stats :is(article, .card) :is(strong, h3, h4, .stat-value),
        body.app-dashboard .dash-grid :is(article, .card, .dash-card) :is(strong, h3, h4, .stat-value),
        .stats :is(article, .card) :is(strong, h3, h4, .stat-value) {
            order: 2 !important;
            color: #0f172a !important;
            font-size: 1.75rem !important;
            font-weight: 800 !important;
            letter-spacing: -0.03em !important;
            line-height: 1.1 !important;
            margin: 0 !important;
            display: block !important;
        }

        /* Chrome alignment lock: final inline override for pages using this shared head. */
        body.dashboard-body :is(.sidebar, #sidebar),
        body.app-dashboard :is(.dash-sidebar, .vendor-sidebar, .agent-sidebar, .sidebar, #sidebar) {
            position: fixed !important;
            inset: 0 auto 0 0 !important;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            width: var(--dashboard-sidebar-width) !important;
            min-width: var(--dashboard-sidebar-width) !important;
            max-width: var(--dashboard-sidebar-width) !important;
            height: 100vh !important;
            height: 100dvh !important;
            overflow-x: hidden !important;
            overflow-y: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            background: #0f172a !important;
            color: #f8fafc !important;
            border-right: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        body.dashboard-body :is(.sidebar, #sidebar) :is(.sidebar-nav, nav, .nav),
        body.app-dashboard :is(.dash-sidebar, .vendor-sidebar, .agent-sidebar, .sidebar, #sidebar) :is(.sidebar-nav, nav, .nav) {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            scrollbar-gutter: stable !important;
        }
        body.dashboard-body :is(.main, .main-content),
        body.app-dashboard :is(.dash-main, .vendor-main, .agent-main, .main-content) {
            margin-left: var(--dashboard-sidebar-width) !important;
            width: calc(100% - var(--dashboard-sidebar-width)) !important;
            max-width: calc(100% - var(--dashboard-sidebar-width)) !important;
            min-width: 0 !important;
            overflow-x: hidden !important;
        }
        body.dashboard-body :is(.sidebar, #sidebar) :is(a, button, .nav-link),
        body.app-dashboard :is(.dash-sidebar, .vendor-sidebar, .agent-sidebar, .sidebar, #sidebar) :is(a, button, .nav-link) {
            min-height: 48px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
            gap: 12px !important;
            text-align: left !important;
            white-space: normal !important;
            word-break: normal !important;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
        }
        body.dashboard-body :is(button, .btn, a.btn, .primary),
        body.app-dashboard :is(button, .btn, a.btn, .primary) {
            min-width: max-content !important;
            white-space: nowrap !important;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
        }
        body.dashboard-body :is(.stats, .dash-grid, .grid, .stats-grid, .metric-grid),
        body.app-dashboard :is(.stats, .dash-grid, .grid, .stats-grid, .metric-grid) {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) !important;
            gap: 18px !important;
            align-items: stretch !important;
        }
        body.dashboard-body :is(.stats, .dash-grid, .stats-grid, .metric-grid) :is(article, .card, .dash-card, .metric-card),
        body.app-dashboard :is(.stats, .dash-grid, .stats-grid, .metric-grid) :is(article, .card, .dash-card, .metric-card) {
            min-width: 0 !important;
            min-height: 132px !important;
            padding: 20px !important;
            gap: 8px !important;
            overflow: hidden !important;
        }
        @media (max-width: 900px) {
            body.dashboard-body :is(.main, .main-content),
            body.app-dashboard :is(.dash-main, .vendor-main, .agent-main, .main-content) {
                width: 100% !important;
                max-width: 100% !important;
                margin-left: 0 !important;
            }
        }

        /* Fractional spacing utilities support */
        .gap-0\.5, [class*="gap-0.5"] { gap: 0.25rem !important; }
        .gap-1\.5, [class*="gap-1.5"] { gap: 0.45rem !important; }
        .gap-2\.5, [class*="gap-2.5"] { gap: 0.65rem !important; }
        .gap-3\.5, [class*="gap-3.5"] { gap: 0.85rem !important; }
        .me-1\.5, [class*="me-1.5"] { margin-right: 0.45rem !important; }
        .ms-1\.5, [class*="ms-1.5"] { margin-left: 0.45rem !important; }
        .mt-1\.5, [class*="mt-1.5"] { margin-top: 0.45rem !important; }
        .mb-1\.5, [class*="mb-1.5"] { margin-bottom: 0.45rem !important; }
        .px-2\.5, [class*="px-2.5"] { padding-left: 0.65rem !important; padding-right: 0.65rem !important; }
        .py-2\.5, [class*="py-2.5"] { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
        .pt-2\.5, [class*="pt-2.5"] { padding-top: 0.65rem !important; }
        .pb-2\.5, [class*="pb-2.5"] { padding-bottom: 0.65rem !important; }
        .px-3\.5, [class*="px-3.5"] { padding-left: 0.9rem !important; padding-right: 0.9rem !important; }
        .py-3\.5, [class*="py-3.5"] { padding-top: 0.9rem !important; padding-bottom: 0.9rem !important; }
    </style>
    <link rel="stylesheet" href="/smartapartment/css/workspace-alignment.css?v=20261008-admin-layout-v6">
</head>
<body>

    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar" class="sidebar bg-dark text-white shadow-lg animate__animated animate__fadeInLeft" id="sidebar">
        <div class="sidebar-header p-4 border-bottom border-secondary d-flex align-items-center gap-3">
            <span class="sidebar-home-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 14.5 16 4l12 10.5V28h-8v-8h-8v8H4Z"/><path d="M9.5 9V5.5h4"/></svg></span>
            <h4 class="mb-0 fw-bold">Smart<span class="text-primary">Apartment</span></h4>
        </div>
        <nav class="nav flex-column py-3" id="sidebarNav">
            <!-- Navigation links will be injected here via JS or Thymeleaf, but for now we keep the structure generic -->
        </nav>
        <div class="sidebar-footer p-3 mt-auto border-top border-secondary text-center">
            <a class="btn btn-outline-light w-100 rounded-pill" href="/dashboards/logout">
                <i class="fa-solid fa-sign-out-alt me-2"></i> Logout
            </a>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script defer src="/smartapartment/js/dashboard-interface.js?v=20261008-alignment-v4"></script>
        <script defer src="/smartapartment/js/crud-workflows.js?v=20261008-crud-v1"></script>
        <script defer src="/smartapartment/js/accountant-button-workflows.js?v=20261008-role-actions-v1"></script>
        <script defer src="/smartapartment/js/button-interactions.js?v=20261008-role-actions-v1"></script>
        <script src="/shared/js/required-fields.js?v=20260826-no-login-star-v5"></script>
        <script src="/shared/js/dashboard-system.js?v=20261006-clean-header-v2"></script>
        <!-- Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
        <!-- Application Logic -->
        <!-- Versioned so dashboard button fixes are not hidden by a browser cache. -->
    <script th:src="@{/smartapartment/js/dashboard.js(v='20261008-demo-buttons-v2')}"></script>
        <script th:src="@{/smartapartment/js/ai-helpdesk.js(v='20260826-ai-helpdesk-v2')}"></script>
    </div>

</body>
</html>
